<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new product listing to the Local Marketplace.">
    <title>Add Product — Local Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <script src="/js/main.js"></script>

    <div class="container">
        <div style="margin-bottom: 2.5rem;" class="fade-in">
            <a href="/overview" class="card__link btn--secondary" id="btn-back">← Back to Shop</a>
        </div>

        <div class="form-box fade-in">
            <h1>List a Product</h1>
            <p class="form-box__subtitle">Fill in the details below to list your product on the marketplace.</p>

            <form id="productForm">
                <div class="form-group">
                    <label class="form-label" for="name">Product Name</label>
                    <input type="text" id="name" class="form-input" placeholder="e.g. iPhone 15 Pro" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="price">Price (₱)</label>
                    <input type="number" id="price" class="form-input" placeholder="e.g. 5000" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="category">Category</label>
                    <input type="text" id="category" class="form-input" placeholder="e.g. Electronics" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="location">Location</label>
                    <input type="text" id="location" class="form-input" placeholder="e.g. Cebu City" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="image">Product Image URL (Optional)</label>
                    <input type="url" id="image" class="form-input" placeholder="https://images.unsplash.com/photo-...">
                    <p style="font-size: 1.1rem; color: var(--text-muted); margin-top: 0.5rem;">Leave blank to use a
                        professional category icon.</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <textarea id="description" class="form-input"
                        placeholder="Briefly describe your product (max 50 chars)" rows="3" required
                        maxlength="50"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="seller">Seller Name</label>
                    <input type="text" id="seller" class="form-input" placeholder="Your name" required>
                </div>

                <button type="submit" class="card__link btn--full btn--lg" id="btn-submit" style="margin: 2.5rem 0 0;">
                    Publish Product
                </button>
            </form>
        </div>
    </div>

    <script>
        renderNavbar('add-item');

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('btn-submit');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Publishing...';

            const newProduct = {
                name: document.getElementById('name').value,
                price: Number(document.getElementById('price').value),
                category: document.getElementById('category').value,
                location: document.getElementById('location').value,
                image: document.getElementById('image').value,
                description: document.getElementById('description').value,
                seller: document.getElementById('seller').value
            };

            try {
                const response = await authFetch('/api/v1/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProduct)
                });

                if (response.ok) {
                    showToast('Product listed successfully!', 'success');
                    setTimeout(() => window.location.href = '/overview', 1500);
                } else {
                    const err = await response.json();
                    showToast(err.message || 'Error adding product. Please check your inputs.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Publish Product';
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Publish Product';
            }
        });
    </script>
</body>

</html>
