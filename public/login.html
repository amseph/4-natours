<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your Local Marketplace account.">
    <title>Log In — Local Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <script src="/js/main.js"></script>

    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="form-box fade-in">
                <h1>Welcome Back</h1>
                <p class="form-box__subtitle">Log in to your marketplace account.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="card__link btn--full btn--lg" id="btn-login" style="margin: 2rem 0 0;">
                        Log In
                    </button>
                </form>

                <div class="form-footer">
                    Don't have an account? <a href="/signup">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        renderNavbar('login');

        if (isLoggedIn()) {
            window.location.href = '/overview';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            const body = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/v1/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (data.status === 'success' && data.token) {
                    localStorage.setItem('jwt', data.token);
                    localStorage.setItem('userName', data.data.user.name);
                    showToast(`Welcome back, ${data.data.user.name}!`, 'success');
                    setTimeout(() => window.location.href = '/overview', 1200);
                } else {
                    showToast(data.message || 'Invalid credentials.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Log In';
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });
    </script>
</body>

</html>
