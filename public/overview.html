<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="description" content="Browse all products available on the Local Marketplace.">
    <title>Products — Local Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <script src="/js/main.js"></script>

    <div class="container">
        <div class="page-header fade-in">
            <span class="page-header__tag">Marketplace</span>
            <h1>Browse Products</h1>
            <p class="page-header__subtitle">Discover what's available from local sellers in your area.</p>
        </div>

        <div class="toolbar fade-in" id="toolbar" style="flex-direction: column; align-items: stretch;">
            <div
                style="display: flex; gap: 2rem; align-items: center; justify-content: space-between; flex-wrap: wrap;">
                <div class="toolbar__search" style="flex: 1; min-width: 30rem;">
                    <i data-lucide="search" class="toolbar__search-icon"></i>
                    <input type="text" class="toolbar__search-input" id="searchInput" placeholder="Search products...">
                </div>
                <div style="display: flex; gap: 2rem; align-items: center;">
                    <span class="toolbar__count" id="productCount" style="margin-top: 0.2rem;"></span>
                    <a href="/add-item" class="card__link btn--success"
                        style="margin: 0; display: flex; align-items: center; gap: 0.8rem; height: 4.8rem; padding: 0 2.5rem; border-radius: 1.2rem;"
                        id="btn-add-product">
                        <i data-lucide="plus" style="width: 1.8rem; height: 1.8rem;"></i> Add Product
                    </a>
                </div>
            </div>

            <div class="filter-container fade-in">
                <span class="filter-section-label">Browse by Category</span>
                <div class="chip-container" id="categoryChips">
                    <button class="chip chip--active" data-value=""><i data-lucide="layers"></i> All</button>
                    <button class="chip" data-value="Electronics"><i data-lucide="cpu"></i> Electronics</button>
                    <button class="chip" data-value="Audio"><i data-lucide="headphones"></i> Audio</button>
                    <button class="chip" data-value="Accessories"><i data-lucide="mouse"></i> Accessories</button>
                </div>

                <div class="filter-row-bottom">
                    <div class="price-select-wrapper">
                        <i data-lucide="banknote" style="width: 1.8rem; height: 1.8rem;"></i>
                        <select id="priceRangeFilter" class="modern-select">
                            <option value="">Any Price Range</option>
                            <option value="0-1000">Under ₱1,000</option>
                            <option value="1000-5000">₱1,000 - ₱5,000</option>
                            <option value="5000-20000">₱5,000 - ₱20,000</option>
                            <option value="20000-50000">₱20,000 - ₱50,000</option>
                            <option value="50000-999999">Above ₱50,000</option>
                        </select>
                    </div>

                    <button id="btnClearFilters" class="btn--secondary"
                        style="border-radius: 1.2rem; height: 4.8rem; padding: 0 2rem; display: flex; align-items: center; gap: 0.8rem;"
                        title="Reset all filters">
                        <i data-lucide="refresh-cw" style="width: 1.6rem;"></i> Reset Filters
                    </button>
                </div>
            </div>
        </div>

        <div id="loading"></div>
        <script>document.getElementById('loading').innerHTML = GHOST_HTML;</script>

        <div id="product-list" class="cards-container" style="display: none;"></div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-state__icon"><i data-lucide="package-search"></i></div>
            <p class="empty-state__text">No products found. Be the first to list something!</p>
            <a href="/add-item" class="card__link">Add Product</a>
        </div>

        <div id="auth-prompt" class="empty-state" style="display: none;">
            <div class="empty-state__icon"><i data-lucide="lock"></i></div>
            <p class="empty-state__text">You need to log in to browse products.</p>
            <a href="/login" class="card__link">Log In</a>
        </div>
    </div>

    <script>
        renderNavbar('overview');

        let allProducts = [];

        async function loadProducts() {
            const loadingEl = document.getElementById('loading');
            const listEl = document.getElementById('product-list');
            const emptyEl = document.getElementById('empty-state');
            const authEl = document.getElementById('auth-prompt');
            const countEl = document.getElementById('productCount');

            const searchTerm = document.getElementById('searchInput').value;
            const activeChip = document.querySelector('.chip--active');
            const category = activeChip ? activeChip.getAttribute('data-value') : '';
            const priceRange = document.getElementById('priceRangeFilter').value;

            const params = new URLSearchParams();
            if (searchTerm) {
                params.append('name[regex]', searchTerm);
                params.append('name[options]', 'i');
            }
            if (category) params.append('category', category);

            if (priceRange) {
                const [min, max] = priceRange.split('-');
                params.append('price[gte]', min);
                params.append('price[lte]', max);
            }

            let query = '?';
            params.forEach((value, key) => {
                query += `${key}=${value}&`;
            });
            if (query === '?') query = '';
            else query = query.slice(0, -1);

            try {
                const response = await authFetch(`/api/v1/products${query}`);

                if (response.status === 401) {
                    loadingEl.style.display = 'none';
                    authEl.style.display = 'block';
                    return;
                }

                const result = await response.json();

                if (result.status === 'success' && result.data && result.data.products) {
                    renderProducts(result.data.products);
                }
            } catch (err) {
                loadingEl.style.display = 'none';
                showToast('Failed to load products. Please try again.', 'error');
            }
        }

        function renderProducts(products) {
            const loadingEl = document.getElementById('loading');
            const listEl = document.getElementById('product-list');
            const emptyEl = document.getElementById('empty-state');
            const countEl = document.getElementById('productCount');

            loadingEl.style.display = 'none';

            if (products.length === 0) {
                listEl.style.display = 'none';
                emptyEl.style.display = 'block';
                countEl.innerHTML = `<strong>0</strong> products found`;
                return;
            }

            emptyEl.style.display = 'none';
            listEl.style.display = 'grid';
            countEl.innerHTML = `<strong>${products.length}</strong> product${products.length !== 1 ? 's' : ''} found`;

            listEl.innerHTML = products.map((p, i) => {
                const icon = getCategoryIcon(p.category);
                const imageHtml = p.image && p.image.startsWith('http')
                    ? `<img src="${p.image}" alt="${p.name}" style="width: 100%; height: 100%; object-fit: cover;">`
                    : `<i data-lucide="${icon}" style="width: 4.5rem; height: 4.5rem; opacity: 0.8;"></i>`;

                return `
                <div class="card" style="animation-delay: ${i * 0.06}s">
                    <span class="card__badge">${p.category || 'General'}</span>
                    <div class="card__emoji">
                        ${imageHtml}
                    </div>
                    
                    <div class="card__body">
                        <div class="card__title-box">
                            <h3 class="card__heading">${p.name}</h3>
                        </div>
                        
                        <div class="card__details">
                            <span>Starting at</span><br>
                            <span class="card__detail--value">₱${Number(p.price).toLocaleString()}</span>
                        </div>
                        
                        <div class="card__location">
                            <i data-lucide="map-pin" style="width: 1.2rem; height: 1.2rem;"></i> ${p.location || 'Unknown'}
                        </div>
                        
                        <a href="/item?id=${p._id}" class="card__link" style="margin-top: 2rem;">
                            View Details
                        </a>
                    </div>
                </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        const searchInput = document.getElementById('searchInput');
        const priceRangeFilter = document.getElementById('priceRangeFilter');
        const btnClear = document.getElementById('btnClearFilters');
        const categoryChips = document.querySelectorAll('.chip');

        let debounceTimer;
        const triggerLoad = () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(loadProducts, 300);
        };

        searchInput.addEventListener('input', triggerLoad);
        priceRangeFilter.addEventListener('change', loadProducts);

        categoryChips.forEach(chip => {
            chip.addEventListener('click', () => {
                categoryChips.forEach(c => c.classList.remove('chip--active'));
                chip.classList.add('chip--active');
                loadProducts();
            });
        });

        btnClear.addEventListener('click', () => {
            searchInput.value = '';
            priceRangeFilter.value = '';
            categoryChips.forEach(c => c.classList.remove('chip--active'));
            document.querySelector('.chip[data-value=""]').classList.add('chip--active');
            loadProducts();
        });

        loadProducts();
    </script>
</body>

</html>
